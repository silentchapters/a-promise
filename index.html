
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Promise of an Artist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #241810;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

  .book-scene {
  width: min(1100px, 100%);
  aspect-ratio: 3 / 2;
  background-image: url('sunset-book.png');
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  position: relative;
  overflow: hidden;
}
  .letter-left,
.letter-right {
  position: absolute;
  top: 25%;
  width: 35%;
  height: 65%;
  padding: 15px;
  color: #29180f;
  font-family: Georgia, serif;
}

.letter-left {
  left: 16%;
}

.letter-left h2 {
  text-align: center;
}

.letter-right {
  right: 10%;
}

.letter-right {
  right: 10%;
}
  </style>
</head>

<body>

<main class="book-scene">

 <div class="letter-left">
  <h2>To My Mamma ❤️</h2>

  <p>
    I know you're scared, I'm scared too.
    But let's face LOVE together and never give up
    on each other, because I only want to feel
    this with you.
  </p>
</div>

  <div class="letter-right">
  </div>

</main>

</body>
</html>
